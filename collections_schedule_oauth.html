<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collections Report</title>
<style>
:root{--border:#5f6368;--soft:#f3f4f6;--text:#111827;--muted:#5f6368;--accent:#1f5f99}
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff;font-size:14px}
.toolbar,.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 10px;padding:12px;border:1px solid #c7c7c7;border-radius:8px;background:var(--soft)}
.filters{background:#fafafa}
label{display:flex;flex-direction:column;gap:4px;font-weight:600}
select,input,button{font:inherit;min-height:38px;padding:7px 10px}
select{min-width:145px}
button{cursor:pointer;border:1px solid #777;border-radius:6px;background:#fff}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.55;cursor:not-allowed}
.custom-range{display:none;gap:10px;align-items:end}
.fields-wrap{position:relative}
.fields-panel{display:none;position:absolute;z-index:20;top:42px;right:0;min-width:230px;padding:10px;border:1px solid #999;border-radius:6px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.fields-panel.open{display:block}
.fields-panel label{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:400;margin:5px 0}
.fields-panel input{min-height:auto;padding:0}
h1{margin:0 0 4px;font-size:24px}
.meta{color:var(--muted);margin-bottom:8px}
.auth{margin-bottom:10px;font-weight:600}
.status{margin:8px 0 12px;min-height:20px;font-weight:600}
.table-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead{display:table-header-group}
th,td{border:1px solid var(--border);padding:6px 8px;vertical-align:top}
th{background:#e7e7e7;text-align:left;white-space:nowrap;overflow:visible;text-overflow:clip}
th.col-address,td.col-address{width:240px;min-width:240px;max-width:240px;white-space:normal;overflow-wrap:anywhere}
th.col-ownerName,td.col-ownerName{width:240px;min-width:240px;max-width:240px;white-space:normal;overflow-wrap:anywhere}
th.col-requestType,td.col-requestType{width:120px;min-width:120px;white-space:nowrap}
th.col-accountType,td.col-accountType{width:120px;min-width:120px;white-space:nowrap}
th.col-activity,td.col-activity{width:245px;min-width:245px;max-width:245px;white-space:normal;overflow-wrap:anywhere}
th.col-status,td.col-status{width:125px;min-width:125px;white-space:nowrap}
th.col-scheduled,td.col-scheduled{width:125px;min-width:125px;white-space:nowrap}
th.col-opened,td.col-opened{width:125px;min-width:125px;white-space:nowrap}
th.col-cans,td.col-cans{width:120px;min-width:120px;max-width:120px;white-space:normal;overflow-wrap:anywhere}
th.col-day,td.col-day{width:120px;min-width:120px;white-space:nowrap}
th.col-notes,td.col-notes{width:auto;min-width:260px;white-space:normal;overflow-wrap:anywhere}
tr{break-inside:avoid}
@page{size:landscape;margin:.35in}
@media print{
 body{padding:0;font-size:9pt}
 .toolbar,.filters,.status,.auth{display:none!important}
 h1{font-size:18pt}
 .table-wrap{overflow:visible}
 table{width:100%;min-width:0!important;table-layout:fixed}
 th,td{font-size:8.25pt;padding:4px 5px}
 th{white-space:nowrap;overflow:visible;text-overflow:clip}
 th.col-address,td.col-address{width:210px;white-space:normal;overflow-wrap:anywhere}
 th.col-ownerName,td.col-ownerName{width:210px;white-space:normal;overflow-wrap:anywhere}
 th.col-requestType,td.col-requestType{width:105px}
 th.col-accountType,td.col-accountType{width:105px}
 th.col-activity,td.col-activity{width:205px;white-space:normal;overflow-wrap:anywhere}
 th.col-status,td.col-status{width:110px}
 th.col-scheduled,td.col-scheduled{width:110px}
 th.col-opened,td.col-opened{width:110px}
 th.col-cans,td.col-cans{width:105px;white-space:normal;overflow-wrap:anywhere}
 th.col-day,td.col-day{width:105px}
 th.col-notes,td.col-notes{width:auto;white-space:normal;min-width:180px}
}
</style>
</head>
<body>
<div class="toolbar">
  <label>Scheduled Date
    <select id="rangePreset">
      <option value="today">Today</option>
      <option value="last7">Last 7 Days</option>
      <option value="last30">Last 30 Days</option>
      <option value="custom">Custom Date Range</option>
      <option value="all" selected>All</option>
    </select>
  </label>
  <div id="customRange" class="custom-range">
    <label>From<input type="date" id="fromDate"></label>
    <label>To<input type="date" id="toDate"></label>
  </div>
  <button type="button" id="signInBtn" class="primary">Sign in to ArcGIS</button>
  <button type="button" id="refreshBtn" disabled>Refresh Schedule</button>
  <button type="button" id="printBtn" disabled>Print Schedule</button>
  <button type="button" id="exportBtn" disabled>Export to Excel</button>
  <button type="button" id="signOutBtn" disabled>Sign Out</button>
  <div class="fields-wrap">
    <button type="button" id="fieldsBtn">Fields to Show ▾</button>
    <div id="fieldsPanel" class="fields-panel"></div>
  </div>
</div>
<div class="filters">
  <label>Activity Status<select id="activityStatusFilter"><option value="">All</option></select></label>
  <label>Request Type<select id="requestTypeFilter"><option value="">All</option></select></label>
  <label>Account Type<select id="accountTypeFilter"><option value="">All</option></select></label>
  <label>Collection Day<select id="collectionDayFilter"><option value="">All</option></select></label>
  <label style="flex:1;min-width:240px">Activity Requested<select id="activityTypeFilter"><option value="">All</option></select></label>
  <label>Sort By
    <select id="sortBy">
      <option value="smart" selected>Smart Sort - Newest</option>
      <option value="openedDesc">Opened Date - Newest</option>
      <option value="openedAsc">Opened Date - Oldest</option>
      <option value="scheduledDesc">Scheduled Date - Newest</option>
      <option value="scheduledAsc">Scheduled Date - Oldest</option>
      <option value="addressAsc">Address A-Z</option>
    </select>
  </label>
  <button type="button" id="clearFiltersBtn">Clear Filters</button>
</div>
<h1>Collections Report</h1>
<div id="auth" class="auth">Not signed in.</div>
<div id="meta" class="meta"></div>
<div id="status" class="status" aria-live="polite"></div>
<div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"><tr><td>Sign in to load the live schedule.</td></tr></tbody></table></div>
<script>
(() => {
  const CLIENT_ID="qo3W5ymZkpyWwyOT";
  const PORTAL="https://www.arcgis.com";
  const AUTHORIZE=PORTAL+"/sharing/rest/oauth2/authorize";
  const TOKEN_URL=PORTAL+"/sharing/rest/oauth2/token/";
  const SERVICE_ROOT="https://services9.arcgis.com/Vhoecg08noPQ7wRF/arcgis/rest/services/Collections_ServiceLocationsV3/FeatureServer";
  const ACTIVITY_URL=SERVICE_ROOT+"/1",SERVICE_LOCATION_URL=SERVICE_ROOT+"/0";
  const REDIRECT_URI="https://jhyder50.github.io/bristol-permit-router-v2/collections_schedule_oauth.html";
  const PAGE_SIZE=2000;
  const BASE_ACTIVITY_FIELDS=["OBJECTID","coll_id","parentglobalid","location_address","location_address2","activity_class","activity_type","scheduled_date","can_nums","co_can","dayofweek","account_type","note","activity_status","co_status"];
  const PARENT_FIELDS="*";
  const COLUMN_DEFS=[
    {key:"address",label:"Address",default:true},{key:"ownerName",label:"Owner Name",default:false},
    {key:"requestType",label:"Request Type",default:false},{key:"accountType",label:"Account Type",default:false},
    {key:"activity",label:"Activity Requested",default:true},{key:"status",label:"Activity Status",default:false},
    {key:"scheduled",label:"Scheduled Date",default:true},{key:"opened",label:"Opened Date",default:false},
    {key:"cans",label:"Can Number(s)",default:true},{key:"day",label:"Collection Day",default:true},{key:"notes",label:"Notes",default:true}
  ];
  const COLUMN_WIDTHS={address:240,ownerName:240,requestType:120,accountType:120,activity:245,status:125,scheduled:125,opened:125,cans:120,day:120};
  const $=id=>document.getElementById(id);
  const rangePreset=$("rangePreset"),customRange=$("customRange"),fromDate=$("fromDate"),toDate=$("toDate");
  const signInBtn=$("signInBtn"),signOutBtn=$("signOutBtn"),refreshBtn=$("refreshBtn"),printBtn=$("printBtn"),exportBtn=$("exportBtn");
  const fieldsBtn=$("fieldsBtn"),fieldsPanel=$("fieldsPanel"),sortBy=$("sortBy");
  const activityStatusFilter=$("activityStatusFilter"),requestTypeFilter=$("requestTypeFilter"),accountTypeFilter=$("accountTypeFilter"),collectionDayFilter=$("collectionDayFilter"),activityTypeFilter=$("activityTypeFilter"),clearFiltersBtn=$("clearFiltersBtn");
  const thead=$("thead"),tbody=$("tbody"),meta=$("meta"),status=$("status"),auth=$("auth");
  let accessToken=sessionStorage.getItem("collections_oauth_access_token")||"",expiresAt=Number(sessionStorage.getItem("collections_oauth_expires_at")||"0"),username=sessionStorage.getItem("collections_oauth_username")||"";
  let allRows=[],currentRangeLabel="",openedFieldName="";
  let selectedFields=new Set(COLUMN_DEFS.filter(c=>c.default).map(c=>c.key));

  function clean(v){return v==null?"":String(v).trim()}
  function normGuid(v){return clean(v).replace(/[{}]/g,"").toLowerCase()}
  function esc(v){return clean(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;").replaceAll("\n","<br>")}
  function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
  function todayIso(){return isoLocal(new Date())}
  function daysAgoIso(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return isoLocal(d)}
  function displayIso(iso){if(!iso)return"";const p=iso.split("-");return p.length===3?`${p[1]}/${p[2]}/${p[0]}`:iso}
  function dateMs(v){const n=Number(v);return Number.isFinite(n)?n:0}
  function arcDate(ms){if(!ms)return"";const d=new Date(Number(ms));return Number.isNaN(d.getTime())?"":isoLocal(d)}
  function randomString(len=64){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";const a=new Uint32Array(len);crypto.getRandomValues(a);return Array.from(a,x=>chars[x%chars.length]).join("")}
  function base64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/ ,"")}
  async function challenge(verifier){return base64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)))}
  function setAuthUI(){const signed=!!accessToken;signInBtn.disabled=signed;signOutBtn.disabled=!signed;refreshBtn.disabled=!signed;printBtn.disabled=!signed;exportBtn.disabled=!signed;auth.textContent=signed?`Signed in to ArcGIS${username?" as "+username:""}.`:"Not signed in."}
  function saveToken(data){accessToken=data.access_token||"";username=data.username||username||"";expiresAt=Date.now()+((Number(data.expires_in)||1800)*1000)-30000;sessionStorage.setItem("collections_oauth_access_token",accessToken);sessionStorage.setItem("collections_oauth_username",username);sessionStorage.setItem("collections_oauth_expires_at",String(expiresAt));setAuthUI()}
  function clearTokens(){accessToken="";username="";expiresAt=0;["collections_oauth_access_token","collections_oauth_username","collections_oauth_expires_at","collections_pkce_verifier","collections_oauth_state"].forEach(k=>sessionStorage.removeItem(k));setAuthUI()}
  async function beginLogin(){const verifier=randomString(64),state=randomString(32);sessionStorage.setItem("collections_pkce_verifier",verifier);sessionStorage.setItem("collections_oauth_state",state);const params=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,code_challenge:await challenge(verifier),code_challenge_method:"S256",state});window.location.assign(AUTHORIZE+"?"+params.toString())}
  async function exchangeCode(code){const verifier=sessionStorage.getItem("collections_pkce_verifier")||"";if(!verifier)throw new Error("PKCE verifier is missing.");const body=new URLSearchParams({f:"json",client_id:CLIENT_ID,grant_type:"authorization_code",redirect_uri:REDIRECT_URI,code,code_verifier:verifier});const r=await fetch(TOKEN_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","Accept":"application/json"},body});const text=await r.text();let data;try{data=JSON.parse(text)}catch(e){throw new Error(`ArcGIS token exchange returned HTTP ${r.status} ${r.statusText} with non-JSON content.`)}if(data.error)throw new Error(data.error_description||data.error.message||JSON.stringify(data.error));saveToken(data);sessionStorage.removeItem("collections_pkce_verifier");sessionStorage.removeItem("collections_oauth_state")}
  async function ensureToken(){if(accessToken&&Date.now()<expiresAt)return true;clearTokens();return false}

  function getRange(){const p=rangePreset.value;if(p==="all")return{from:null,to:null,label:"All"};if(p==="today"){const t=todayIso();return{from:t,to:t,label:"Today"}}if(p==="last7")return{from:daysAgoIso(6),to:todayIso(),label:"Last 7 Days"};if(p==="last30")return{from:daysAgoIso(29),to:todayIso(),label:"Last 30 Days"};return{from:fromDate.value||null,to:toDate.value||null,label:"Custom Date Range"}}
  function makeWhere(r){const c=[];if(r.from)c.push(`scheduled_date >= DATE '${r.from} 00:00:00'`);if(r.to){const d=new Date(r.to+"T00:00:00");d.setDate(d.getDate()+1);c.push(`scheduled_date < DATE '${isoLocal(d)} 00:00:00'`)}return c.length?c.join(" AND "):"1=1"}
  async function fetchJson(url,options){const resp=await fetch(url,options),text=await resp.text();let data;try{data=JSON.parse(text)}catch(e){throw new Error(`ArcGIS returned HTTP ${resp.status} ${resp.statusText} with non-JSON content.`)}if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));return data}
  async function queryLayer(url,obj){const body=new URLSearchParams({f:"json",token:accessToken,...obj});const data=await fetchJson(url+"/query",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","Accept":"application/json"},body});return Array.isArray(data.features)?data.features:[]}
  async function queryAllFeatures(url,obj){const all=[];let offset=0;while(true){status.textContent=`Loading activity records… ${offset.toLocaleString()} loaded`;const page=await queryLayer(url,{...obj,resultOffset:String(offset),resultRecordCount:String(PAGE_SIZE)});all.push(...page);if(page.length<PAGE_SIZE)break;offset+=page.length}return all}
  async function resolveOpenedField(){if(openedFieldName)return openedFieldName;const data=await fetchJson(ACTIVITY_URL+`?f=json&token=${encodeURIComponent(accessToken)}`);const fields=Array.isArray(data.fields)?data.fields:[];const norm=s=>clean(s).toLowerCase().replace(/[^a-z0-9]/g,"");const aliases=["openeddate","opendate","dateopened","dateopen"];
    const hit=fields.find(f=>aliases.includes(norm(f.alias))||aliases.includes(norm(f.name))||(norm(f.alias).includes("open")&&norm(f.alias).includes("date"))||(norm(f.name).includes("open")&&norm(f.name).includes("date")));
    openedFieldName=hit?hit.name:"";return openedFieldName}
  async function parentMapFor(activityFeatures){const gids=[...new Set(activityFeatures.map(f=>normGuid((f.attributes||{}).parentglobalid)).filter(Boolean))],map=new Map();for(let i=0;i<gids.length;i+=100){status.textContent=`Loading service details… ${Math.min(i+100,gids.length).toLocaleString()} of ${gids.length.toLocaleString()}`;const vals=gids.slice(i,i+100).map(g=>`'${g.replaceAll("'","''")}'`);const fs=await queryLayer(SERVICE_LOCATION_URL,{where:`GlobalID IN (${vals.join(",")})`,outFields:PARENT_FIELDS,returnGeometry:"false",resultRecordCount:"2000"});fs.forEach(f=>{const a=f.attributes||{};map.set(normGuid(a.GlobalID),a)})}return map}
  function bestAddress(a,p){return clean(a.location_address)||clean(a.location_address2)||clean(p&&p.location_address)||clean(p&&p.location_address_orig)}
  function bestCans(a,p){const vals=[];[a.can_nums,a.co_can,p&&p.can_nums].forEach(v=>{const s=clean(v);if(s&&!vals.includes(s))vals.push(s)});return vals.join(", ")}
  function bestDay(a,p){return clean(a.dayofweek)||clean(p&&p.dayofweek)}
  function bestAccountType(a,p){return clean(a.account_type)||clean(p&&p.account_type)}
  function bestOwnerName(p){if(!p)return"";const candidates=["owner_name","ownername","owner","customer_name","customername","account_name","accountname","property_owner","propertyowner"];for(const k of candidates){if(clean(p[k]))return clean(p[k])}for(const k of Object.keys(p)){const n=k.toLowerCase().replace(/[^a-z0-9]/g,"");if(["ownername","customername","accountname","propertyowner"].includes(n)&&clean(p[k]))return clean(p[k])}return""}
  function uniqueValues(values){return [...new Set(values.map(clean).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}))}
  function dayValues(values){const order=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],vals=[...new Set(values.map(clean).filter(Boolean))];return vals.sort((a,b)=>{const ai=order.findIndex(x=>x.toLowerCase()===a.toLowerCase()),bi=order.findIndex(x=>x.toLowerCase()===b.toLowerCase());if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return-1;if(bi>=0)return 1;return a.localeCompare(b)})}
  function populateSelect(select,values,sorter=uniqueValues){const previous=select.value,sorted=sorter(values);select.replaceChildren(new Option("All",""),...sorted.map(v=>new Option(v,v)));if(sorted.includes(previous))select.value=previous}
  function populateFiltersFromRows(){populateSelect(activityStatusFilter,allRows.map(r=>r.status));populateSelect(requestTypeFilter,allRows.map(r=>r.requestType));populateSelect(accountTypeFilter,allRows.map(r=>r.accountType));populateSelect(collectionDayFilter,allRows.map(r=>r.day),dayValues);populateSelect(activityTypeFilter,allRows.map(r=>r.activity))}
  function buildFieldPanel(){fieldsPanel.innerHTML=COLUMN_DEFS.map(c=>`<label><input type="checkbox" data-field="${c.key}" ${selectedFields.has(c.key)?"checked":""}> ${esc(c.label)}</label>`).join("");fieldsPanel.querySelectorAll('input[data-field]').forEach(cb=>cb.addEventListener('change',()=>{const key=cb.dataset.field;if(cb.checked)selectedFields.add(key);else selectedFields.delete(key);if(selectedFields.size===0){cb.checked=true;selectedFields.add(key)}renderTable()}))}
  function filteredRows(){return allRows.filter(r=>(!activityStatusFilter.value||r.status===activityStatusFilter.value)&&(!requestTypeFilter.value||r.requestType===requestTypeFilter.value)&&(!accountTypeFilter.value||r.accountType===accountTypeFilter.value)&&(!collectionDayFilter.value||r.day===collectionDayFilter.value)&&(!activityTypeFilter.value||r.activity===activityTypeFilter.value))}
  function sortRows(rows){const out=[...rows],addr=(a,b)=>a.address.localeCompare(b.address,undefined,{numeric:true,sensitivity:"base"}),asc=(a,b,key)=>(a[key]||Number.MAX_SAFE_INTEGER)-(b[key]||Number.MAX_SAFE_INTEGER)||addr(a,b),desc=(a,b,key)=>(b[key]||0)-(a[key]||0)||addr(a,b);switch(sortBy.value){case"openedDesc":return out.sort((a,b)=>desc(a,b,"openedMs"));case"openedAsc":return out.sort((a,b)=>asc(a,b,"openedMs"));case"scheduledDesc":return out.sort((a,b)=>desc(a,b,"scheduledMs"));case"scheduledAsc":return out.sort((a,b)=>asc(a,b,"scheduledMs"));case"addressAsc":return out.sort(addr);default:return out.sort((a,b)=>{const ae=a.status.toLowerCase()==="scheduled"&&a.scheduledMs?a.scheduledMs:a.openedMs,be=b.status.toLowerCase()==="scheduled"&&b.scheduledMs?b.scheduledMs:b.openedMs;return (be||0)-(ae||0)||addr(a,b)})}}
  function visibleColumns(){return COLUMN_DEFS.filter(c=>selectedFields.has(c.key))}
  function renderTable(){const cols=visibleColumns(),rows=sortRows(filteredRows()),table=thead.closest("table"),fixedWidth=cols.filter(c=>c.key!=="notes").reduce((sum,c)=>sum+(COLUMN_WIDTHS[c.key]||120),0);table.style.minWidth=`${fixedWidth+(cols.some(c=>c.key==="notes")?260:0)}px`;thead.innerHTML='<tr>'+cols.map(c=>`<th class="col-${c.key}">${esc(c.label)}</th>`).join('')+'</tr>';tbody.innerHTML=rows.length?rows.map(r=>'<tr>'+cols.map(c=>`<td class="col-${c.key}" title="${esc(r[c.key]).replaceAll('<br>',' ')}">${esc(r[c.key])}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${cols.length}">No activity records match the current filters.</td></tr>`;const active=[];if(activityStatusFilter.value)active.push(`Activity Status: ${activityStatusFilter.value}`);if(requestTypeFilter.value)active.push(`Request Type: ${requestTypeFilter.value}`);if(accountTypeFilter.value)active.push(`Account Type: ${accountTypeFilter.value}`);if(collectionDayFilter.value)active.push(`Collection Day: ${collectionDayFilter.value}`);if(activityTypeFilter.value)active.push(`Activity Requested: ${activityTypeFilter.value}`);const sortLabel=sortBy.options[sortBy.selectedIndex]?.text||"";meta.textContent=`${currentRangeLabel} | Sort: ${sortLabel} | Records: ${rows.length.toLocaleString()}${active.length?" | "+active.join(" | "):""}`}
  function excelEscape(v){return esc(v).replaceAll("<br>","<br/>")}
  function exportExcel(){const cols=visibleColumns(),rows=sortRows(filteredRows());if(!rows.length){status.textContent="No records match the current filters to export.";return}const table=`<table border="1"><thead><tr>${cols.map(c=>`<th>${excelEscape(c.label)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${excelEscape(r[c.key])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;const html=`<!doctype html><html><head><meta charset="utf-8"><style>table{border-collapse:collapse;font-family:Arial,sans-serif}th,td{border:1px solid #666;padding:5px;vertical-align:top}th{font-weight:bold;background:#e7e7e7}</style></head><body><h2>Collections Report</h2><p>${excelEscape(meta.textContent)}</p>${table}</body></html>`;const blob=new Blob(["\ufeff",html],{type:"application/vnd.ms-excel;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Collections_Report_${todayIso()}.xls`;document.body.appendChild(a);a.click();const href=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);status.textContent=`Exported ${rows.length.toLocaleString()} records to Excel.`}
  async function loadSchedule(){const r=getRange();if(rangePreset.value==="custom"){if(!r.from||!r.to){status.textContent="Choose both From and To dates.";return}if(r.from>r.to){status.textContent="The From date cannot be after the To date.";return}}if(!await ensureToken()){status.textContent="Sign in to ArcGIS to load the schedule.";return}const openedField=await resolveOpenedField(),outFields=[...BASE_ACTIVITY_FIELDS,...(openedField&&!BASE_ACTIVITY_FIELDS.includes(openedField)?[openedField]:[])].join(",");const activities=await queryAllFeatures(ACTIVITY_URL,{where:makeWhere(r),outFields,returnGeometry:"false",orderByFields:"OBJECTID ASC"}),parents=await parentMapFor(activities);allRows=activities.map(f=>{const a=f.attributes||{},p=parents.get(normGuid(a.parentglobalid))||{},scheduledMs=dateMs(a.scheduled_date),openedMs=openedField?dateMs(a[openedField]):0;return{address:bestAddress(a,p),ownerName:bestOwnerName(p),requestType:clean(a.activity_class),accountType:bestAccountType(a,p),activity:clean(a.activity_type),status:clean(a.activity_status),scheduled:displayIso(arcDate(scheduledMs)),opened:displayIso(arcDate(openedMs)),scheduledMs,openedMs,cans:bestCans(a,p),day:bestDay(a,p),notes:clean(a.note)}});populateFiltersFromRows();currentRangeLabel=!r.from&&!r.to?"All activity records":r.from===r.to?`${r.label}: ${displayIso(r.from)}`:`${r.label}: ${displayIso(r.from)} - ${displayIso(r.to)}`;status.textContent=openedField?"":"Opened Date field was not found in the Activity layer.";renderTable()}
  async function handleCallback(){const q=new URLSearchParams(location.search),code=q.get("code"),returnedState=q.get("state");if(!code)return false;const expected=sessionStorage.getItem("collections_oauth_state");if(!expected||returnedState!==expected)throw new Error("OAuth state validation failed.");status.textContent="Completing ArcGIS sign-in…";await exchangeCode(code);history.replaceState({},document.title,REDIRECT_URI);try{await loadSchedule()}catch(e){status.textContent="Signed in, but ArcGIS data load failed: "+e.message}return true}
  buildFieldPanel();renderTable();
  rangePreset.addEventListener("change",()=>{customRange.style.display=rangePreset.value==="custom"?"flex":"none";if(accessToken&&rangePreset.value!=="custom")loadSchedule().catch(e=>status.textContent=e.message)});
  [fromDate,toDate].forEach(el=>el.addEventListener('change',()=>{if(accessToken&&rangePreset.value==='custom'&&fromDate.value&&toDate.value)loadSchedule().catch(e=>status.textContent=e.message)}));
  [activityStatusFilter,requestTypeFilter,accountTypeFilter,collectionDayFilter,activityTypeFilter,sortBy].forEach(el=>el.addEventListener('change',renderTable));
  clearFiltersBtn.addEventListener('click',()=>{[activityStatusFilter,requestTypeFilter,accountTypeFilter,collectionDayFilter,activityTypeFilter].forEach(el=>el.value='');sortBy.value='smart';renderTable()});
  fieldsBtn.addEventListener('click',e=>{e.stopPropagation();fieldsPanel.classList.toggle('open')});document.addEventListener('click',e=>{if(!fieldsPanel.contains(e.target)&&e.target!==fieldsBtn)fieldsPanel.classList.remove('open')});
  signInBtn.addEventListener("click",()=>beginLogin().catch(e=>status.textContent=e.message));signOutBtn.addEventListener("click",()=>{clearTokens();allRows=[];currentRangeLabel="";tbody.innerHTML='<tr><td>Sign in to load the live schedule.</td></tr>';meta.textContent="";status.textContent=""});refreshBtn.addEventListener("click",()=>loadSchedule().catch(e=>status.textContent="Live ArcGIS query failed: "+e.message));printBtn.addEventListener("click",()=>window.print());exportBtn.addEventListener("click",exportExcel);
  setAuthUI();handleCallback().then(done=>{if(!done&&accessToken)loadSchedule().catch(e=>status.textContent="ArcGIS data load failed: "+e.message)}).catch(e=>{if(!accessToken)clearTokens();status.textContent="ArcGIS sign-in failed: "+e.message});
})();
